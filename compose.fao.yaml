# LOCAL demonstration only. Both services bind to 127.0.0.1, not the LAN/public internet.
services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.fao
      args:
        SCIKIT_LEARN_VERSION: ${SCIKIT_LEARN_VERSION:-}
    image: fao-scholarship-v3:local
    command:
      - python
      - -m
      - streamlit
      - run
      - dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - type: bind
        source: ./artifacts
        target: /app/artifacts
        read_only: true
        bind:
          create_host_path: false
    environment:
      PYTHONUNBUFFERED: "1"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.fao
      args:
        SCIKIT_LEARN_VERSION: ${SCIKIT_LEARN_VERSION:-}
    image: fao-scholarship-v3:local
    command:
      - python
      - -m
      - uvicorn
      - src.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - type: bind
        source: ./artifacts
        target: /app/artifacts
        read_only: true
        bind:
          create_host_path: false
    environment:
      PYTHONUNBUFFERED: "1"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; x=json.load(urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)); assert x.get('model_ready') is True, x"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: unless-stopped
